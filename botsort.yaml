# Real-World Static CCTV Optimized BoT-SORT Configuration
tracker_type: botsort
track_high_thresh: 0.5      # Only associate high-confidence detections (>0.5) in the first step
track_low_thresh: 0.1       # Second-stage threshold for associating partially occluded targets
new_track_thresh: 0.6       # Start a new track ID only if confidence is high (prevents noise tracks)
track_buffer: 60            # Keep lost tracks alive for 60 frames (2 seconds) to handle occlusion/head turns
match_thresh: 0.8           # Strict IoU association threshold
fuse_score: True

# BoT-SORT Specifics
gmc_method: none            # Disable Global Motion Compensation (optical flow is slow and unnecessary for static cameras)
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
